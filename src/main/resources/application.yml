spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mallAI?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: Ww19970612
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wxmall.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  config: classpath:logback-spring.xml

# 微信小程序配置
wx:
  miniapp:
    appid: 你的小程序appid  # 替换为实际的小程序appid
    secret: 你的小程序secret  # 替换为实际的小程序secret
  
  # 微信支付配置
  pay:
    appId: 你的小程序appid  # 与小程序appid一致
    mchId: 你的商户号  # 微信支付商户号
    mchKey: 你的商户API密钥  # 微信支付商户API密钥
    keyPath: classpath:cert/apiclient_cert.p12  # 微信支付商户证书路径
    notifyUrl: https://你的域名/api/pay/notify  # 支付结果通知地址
    refundNotifyUrl: https://你的域名/api/pay/refund/notify  # 退款结果通知地址
    tradeType: JSAPI  # 小程序支付类型
    signType: HMAC-SHA256  # 签名类型
    sandbox: false  # 是否使用沙箱环境
    apiV3Key: 你的APIv3密钥  # 微信支付APIv3密钥
    privateKeyPath: cert/apiclient_key.pem  # 微信支付商户私钥路径
    certSerialNo: 你的证书序列号  # 微信支付商户证书序列号
